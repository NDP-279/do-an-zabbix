# file đã được rút gọn
# chỉnh sửa mục `require ip` thành dải ip 192.168.27.0/24 để server có thể thu thập và giám sát dịch vụ web
<Location /server-status>
	SetHandler server-status
	Require local
	Require ip 192.168.27.0/24
</Location>
ExtendedStatus On
<IfModule mod_proxy.c>
	# Show Proxy LoadBalancer status in mod_status
	ProxyStatus On
</IfModule>
